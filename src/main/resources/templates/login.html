<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Core Tech</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body class="bg-black text-white">


<main>

    <section class="login-section">

        <div class="cartao-dividido">

            <div class="painel-esquerdo">
                <div class="wrap-formulario">
                    <h2 class="titulo-entrar">Fazer Login</h2>

                    <p class="subtitulo">Faça login com seu e-mail e senha</p>

                    <form id="formularioLogin" class="formulario-autenticacao">
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                        <div class="input-group">
                            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                            <button type="button" class="btn-eye" data-target="senha" aria-label="Mostrar senha"><i class="fa-solid fa-eye"></i></button>
                        </div>

                        <div class="acoes-login">
                            <button type="submit" class="btn-entrar">ENTRAR</button>
                        </div>
                    </form>

                    <a class="esqueci-senha" href="#">Esqueceu a senha?</a>
                    <!-- Botão de cadastro visível apenas em mobile (painel laranja oculto) -->
                    <a id="btnCadastrarMobile" class="btn-contorno btn-cadastrar-mobile" href="register.html">CADASTRAR</a>
                </div>
            </div>

            <div class="painel-direito">
                <div class="promocao">
                    <h3>Bem vindo de volta!</h3>
                    <p>Cadastre-se agora e desfrute do nosso site</p>
                    <a id="btnCadastrar" class="btn-contorno" href="register.html">CADASTRAR</a>
                </div>
            </div>

        </div>

    </section>

</main>

<script src="../js/login.js"></script>
<script src="../js/login-anim.js"></script>
</body>

</html>
